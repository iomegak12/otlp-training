# TradeNova OpenTelemetry lab stack
#
#   docker compose up -d --build          start everything except the load generator
#   docker compose --profile load up -d   also start the load generator (from Lab B onwards)
#
# Lab exercises only change files in ./config, ./collector and ./services.

name: tradenova

services:
  # ---------------------------------------------------------------- telemetry pipeline
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./collector:/etc/otelcol-contrib:ro
    environment:
      DEBUG_VERBOSITY: ${DEBUG_VERBOSITY:-basic}
    ports:
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "8889:8889"     # Prometheus exporter (metrics received by the Collector)
      - "13133:13133"   # health_check extension
    depends_on:
      - jaeger
      - loki

  # ---------------------------------------------------------------- backends
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports:
      - "16686:16686"   # Jaeger UI

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=exemplar-storage
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/loki.yaml:ro
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:12.4.11
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - jaeger

  # ---------------------------------------------------------------- infrastructure
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tradenova
      POSTGRES_USER: tradenova
      POSTGRES_PASSWORD: tradenova
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradenova -d tradenova"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ---------------------------------------------------------------- TradeNova services
  order-service:
    build: ./services/order-service
    env_file: ./config/order-service.env
    environment:
      QUOTE_SERVICE_URL: http://quote-service:8000
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
      quote-service:
        condition: service_started

  quote-service:
    build: ./services/quote-service
    env_file: ./config/quote-service.env
    ports:
      - "8000:8000"
    healthcheck:
      # This health check calls /health every 5 seconds. Once the service is
      # instrumented (Lab B), each call becomes a trace.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  settlement-service:
    build: ./services/settlement-service
    env_file: ./config/settlement-service.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      QUOTE_SERVICE_URL: http://quote-service:8000
      DATABASE_URL: postgresql://tradenova:tradenova@postgres:5432/tradenova
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  loadgen:
    build: ./services/loadgen
    profiles: ["load"]
    environment:
      ORDER_SERVICE_URL: http://order-service:8080
      ORDERS_PER_SECOND: ${ORDERS_PER_SECOND:-4}
    depends_on:
      - order-service
