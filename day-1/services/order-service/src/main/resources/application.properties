spring.application.name=order-service
server.port=8080

tradenova.quote-service.url=${QUOTE_SERVICE_URL:http://quote-service:8000}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# The Java agent puts trace_id and span_id in the logging MDC; this pattern prints them.
logging.pattern.level=%5p [trace_id=%X{trace_id:-} span_id=%X{span_id:-}]

management.endpoints.web.exposure.include=health
