spring.application.name=trade-api
server.port=8080

# DEBUG is switched on deliberately: it is the "debug log noise" in scenario 4.
logging.level.com.tradenova=DEBUG
# The Java agent puts trace_id and span_id in the logging MDC; this pattern prints them.
logging.pattern.level=%5p [trace_id=%X{trace_id:-} span_id=%X{span_id:-}]
