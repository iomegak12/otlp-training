# TradeNova Day 2: the observability platform
#
#   docker compose up -d --build                                  start everything
#   docker compose run --rm fleet status | scale N                manage the simulated EC2 fleet (scenario 7)
#   docker compose --profile spike run --rm telemetrygen          the market-open spike (scenario 2)
#
# Scenarios change only: .env, collector/agent/config.yaml, infra/prometheus/prometheus.yml
# and infra/tempo/tempo.yaml (see scenarios/ and scripts/apply-scenario.sh).

name: tradenova-day2

x-otel-app-env: &otel-app-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-agent:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_METRIC_EXPORT_INTERVAL: "10000"
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp

services:
  # ============================================================ TradeNova workloads
  trade-api:
    build: ./services/trade-api
    environment:
      <<: *otel-app-env
      OTEL_SERVICE_NAME: trade-api
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=tradenova,service.version=2.0.0
      # The Java SDK keeps at most 2,000 series per metric by default. Raised so the per-account
      # metric in scenario 4 shows its true cost instead of collapsing into an overflow series.
      OTEL_JAVA_METRICS_CARDINALITY_LIMIT: "100000"
      JDK_JAVA_OPTIONS: -Xmx384m
    ports:
      - "8080:8080"
    depends_on:
      - otel-agent
    restart: unless-stopped

  portfolio-service:
    build: ./services/portfolio-service
    environment:
      <<: *otel-app-env
      OTEL_SERVICE_NAME: portfolio-service
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=tradenova,service.version=2.0.0
      OTEL_SEMCONV_STABILITY_OPT_IN: http
      TRADE_API_URL: http://trade-api:8080
    ports:
      - "8000:8000"
    depends_on:
      - otel-agent
      - trade-api
    restart: unless-stopped

  eod-reconciliation:
    build: ./services/eod-reconciliation
    environment:
      PUSHGATEWAY_URL: http://pushgateway:9091
      EOD_PUSH_ENABLED: ${EOD_PUSH_ENABLED:-false}
      EOD_FAILURE_MODE: ${EOD_FAILURE_MODE:-random}
      EOD_INTERVAL_SECONDS: ${EOD_INTERVAL_SECONDS:-90}
    depends_on:
      - pushgateway
    restart: unless-stopped

  loadgen:
    build: ./services/loadgen
    environment:
      TRADE_API_URL: http://trade-api:8080
      PORTFOLIO_URL: http://portfolio-service:8000
      LOADGEN_RPS: ${LOADGEN_RPS:-5}
    depends_on:
      - trade-api
      - portfolio-service
    restart: unless-stopped

  # ============================================================ OpenTelemetry Collectors
  otel-agent:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./collector/agent:/etc/otelcol:ro
    environment:
      # Scenario 2: makes Go's garbage collector respect the container limit (set in .env).
      GOMEMLIMIT: ${AGENT_GOMEMLIMIT:-}
    # Deliberately small, like a sidecar or DaemonSet agent: scenario 2 shows what happens
    # at the limit with and without memory protection.
    mem_limit: 320m
    memswap_limit: 320m   # no swap: the limit is a hard limit
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    restart: unless-stopped

  otel-gateway:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./collector/gateway:/etc/otelcol:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ============================================================ Log buffer
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.3.1
    entrypoint: ["sh", "/scripts/create-topics.sh"]
    volumes:
      - ./infra/kafka:/scripts:ro
    depends_on:
      kafka:
        condition: service_healthy

  # ============================================================ Backends
  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./infra/loki:/etc/loki:ro
    ports:
      - "3100:3100"
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    user: "0"
    volumes:
      - ./infra/tempo:/etc/tempo:ro
    ports:
      - "3200:3200"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver   # metrics pushed by the Collector agent and Tempo
      - --web.enable-lifecycle               # allows: curl -X POST localhost:9090/-/reload
      - --enable-feature=exemplar-storage
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  pushgateway:
    image: prom/pushgateway:v1.11.3
    ports:
      - "9091:9091"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./infra/alertmanager:/etc/alertmanager:ro
    ports:
      - "9093:9093"
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "8025:8025"   # web inbox (SMTP on 1025 inside the network)
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.11
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    restart: unless-stopped

  # ============================================================ Infrastructure
  # The Linux host the platform runs on.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped

  # The market-data fleet. Each container stands for one EC2 server; the fake AWS API decides
  # which of them are "running instances" (docker compose run --rm fleet scale N).
  market-data-1:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
  market-data-2:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
  market-data-3:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
  market-data-4:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
  market-data-5:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped

  # Fake AWS API (Moto): answers EC2 DescribeInstances like real AWS, so Prometheus can
  # discover the fleet with the same ec2_sd_configs it would use in production.
  fake-aws:
    image: motoserver/moto:5.2.3
    restart: unless-stopped

  # Registers market-data-1..3 as running EC2 instances at start-up.
  fleet-init:
    build: ./infra/fake-aws
    environment:
      FAKE_AWS_URL: http://fake-aws:5000
    command: ["scale", "3"]
    depends_on:
      - fake-aws
    restart: on-failure

  # Used during scenario 7: docker compose run --rm fleet scale 5
  fleet:
    build: ./infra/fake-aws
    profiles: ["tools"]
    environment:
      FAKE_AWS_URL: http://fake-aws:5000
    depends_on:
      - fake-aws

  # ============================================================ Scenario 2 load spike
  # 90 seconds of traces as fast as possible, straight at the agent.
  telemetrygen:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
    profiles: ["spike"]
    command:
      - traces
      - --otlp-endpoint=otel-agent:4317
      - --otlp-insecure
      - --service=market-open-burst
      - --workers=8
      - --rate=0
      - --child-spans=10
      - --duration=90s
    depends_on:
      - otel-agent
