# TradeNova Prometheus
#
# After scenario 6: the Pushgateway is scraped (batch job results).
# Apply changes without a restart:  curl -X POST http://localhost:9090/-/reload
#
# Metrics from trade-api and portfolio-service are not scraped: the Collector agent pushes them
# here with remote write (--web.enable-remote-write-receiver in docker-compose.yml).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The Collectors' own health metrics (scenario 2 and 5).
  - job_name: otel-collectors
    static_configs:
      - targets: ["otel-agent:8888", "otel-gateway:8888"]

  # The Linux host the platform runs on.
  - job_name: platform-host
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          team: platform

  # The market-data fleet, maintained by hand. It lists one server; the fleet has grown since.
  - job_name: market-data
    static_configs:
      - targets: ["market-data-1:9100"]

  # --- Scenario 6: results of short-lived batch jobs, pushed to the Pushgateway.
  # honor_labels keeps the job label the batch job pushed (eod_reconciliation)
  # instead of overwriting it with this scrape job's name.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
