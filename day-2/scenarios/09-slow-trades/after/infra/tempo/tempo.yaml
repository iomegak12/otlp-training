# TradeNova Tempo (single binary, local storage)
#
# After scenario 9: the metrics generator builds the service graph and RED metrics.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

# Turns spans into metrics and writes them into Prometheus with remote write:
#   service graph:  traces_service_graph_request_total, ..._failed_total, ..._server_seconds
#   span metrics:   traces_spanmetrics_calls_total, traces_spanmetrics_latency (histogram)
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      # Scenario 9 switches this on: [service-graphs, span-metrics]
      processors: [service-graphs, span-metrics]
