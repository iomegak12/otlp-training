# Lab 4: a private certificate authority for the telemetry pipeline (cert-manager).
#   1. a self-signed issuer creates the CA certificate "tradenova-telemetry-ca"
#   2. a ClusterIssuer signs every other certificate with that CA
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tradenova-telemetry-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: TradeNova Telemetry CA
  secretName: tradenova-telemetry-ca
  duration: 8760h
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: tradenova-telemetry-ca
spec:
  ca:
    secretName: tradenova-telemetry-ca
