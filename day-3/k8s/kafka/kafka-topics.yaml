# One topic per signal. 6 partitions each: up to 6 gateway replicas can share the work (Lab 1).
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: otlp-traces
  namespace: kafka
  labels:
    strimzi.io/cluster: tradenova
spec:
  partitions: 6
  replicas: 3
  config:
    retention.ms: 86400000      # 24 hours: how long data can wait for the gateways
    min.insync.replicas: 2
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: otlp-metrics
  namespace: kafka
  labels:
    strimzi.io/cluster: tradenova
spec:
  partitions: 6
  replicas: 3
  config:
    retention.ms: 86400000
    min.insync.replicas: 2
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: otlp-logs
  namespace: kafka
  labels:
    strimzi.io/cluster: tradenova
spec:
  partitions: 6
  replicas: 3
  config:
    retention.ms: 86400000
    min.insync.replicas: 2
