# Kafka for TradeNova: 3 brokers (KRaft, each also a controller), one per worker node.
#   port 9092  plain, no authentication   (used until Lab 4)
#   port 9093  TLS + client-certificate authentication (Lab 4)
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels:
    strimzi.io/cluster: tradenova
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 5Gi
        deleteClaim: true
        kraftMetadata: shared
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { memory: 2Gi }
  jvmOptions:
    "-Xms": 512m
    "-Xmx": 1g
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: tradenova
  namespace: kafka
spec:
  kafka:
    version: 4.3.1
    metadataVersion: 4.3-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: tls
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      auto.create.topics.enable: false
  entityOperator:
    topicOperator: {}
    # KafkaUsers (and their certificate secrets) live next to the Collectors.
    userOperator:
      watchedNamespace: observability
  # Exposes consumer-group lag (kafka_consumergroup_lag) to Prometheus: Labs 1, 2 and 3.
  kafkaExporter:
    topicRegex: "otlp-.*"
    groupRegex: ".*"
    template:
      pod:
        metadata:
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "9404"
