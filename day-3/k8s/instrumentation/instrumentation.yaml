# AFTER LAB 4: mTLS + token, Kafka TLS, attribute allowlist, tenant routing
# Instrumentation: how the Operator instruments TradeNova pods. A pod opts in with an annotation:
#   instrumentation.opentelemetry.io/inject-java: "true"      (trade-api)
#   instrumentation.opentelemetry.io/inject-python: "true"    (portfolio-service, eod-reconciliation)
#   instrumentation.opentelemetry.io/inject-nodejs: "true"    (notification-service)
# The Operator adds an init container with the agent/SDK and sets the OTEL_* variables below.
# Changes only reach pods created afterwards: restart the deployments after applying.

apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: tradenova
  namespace: tradenova
spec:
  exporter:
    endpoint: https://otel-agent-collector.observability.svc.cluster.local:4318
    tls:
      secretName: otel-client-tls
      ca_file: ca.crt
      cert_file: tls.crt
      key_file: tls.key
  propagators:
  - tracecontext
  - baggage
  sampler:
    type: parentbased_traceidratio
    argument: '1'
  env:
  - name: OTEL_EXPORTER_OTLP_PROTOCOL
    value: http/protobuf
  - name: OTEL_METRIC_EXPORT_INTERVAL
    value: '15000'
  - name: OTEL_LOGS_EXPORTER
    value: otlp
  - name: OTEL_SEMCONV_STABILITY_OPT_IN
    value: http
  - name: OTEL_EXPORTER_OTLP_HEADERS
    valueFrom:
      secretKeyRef:
        name: otel-ingest-token
        key: header
  python:
    env:
    - name: OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED
      value: 'true'
