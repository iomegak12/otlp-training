# AFTER LAB 4: mTLS + token, Kafka TLS, attribute allowlist, tenant routing
# Agent Collector: one per worker node (DaemonSet), managed by the OpenTelemetry Operator.
# Receives OTLP from the applications and publishes traces, metrics and logs to Kafka.

apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-agent
  namespace: observability
spec:
  mode: daemonset
  image: otel/opentelemetry-collector-contrib:0.161.0
  serviceAccount: otel-agent
  trafficDistribution: PreferSameNode
  podAnnotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port: '8888'
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  env:
  - name: GOMEMLIMIT
    value: 400MiB
  - name: K8S_NODE_NAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName
  - name: INGEST_TOKEN
    valueFrom:
      secretKeyRef:
        name: otel-ingest-token
        key: token
        optional: true
  initContainers:
  - name: queue-dir-permissions
    image: busybox:1.37
    command:
    - sh
    - -c
    - mkdir -p /var/lib/otelcol/agent && chown -R 10001:10001 /var/lib/otelcol/agent
    volumeMounts:
    - name: queue
      mountPath: /var/lib/otelcol
  volumes:
  - name: queue
    hostPath:
      path: /var/lib/otelcol
      type: DirectoryOrCreate
  - name: agent-tls
    secret:
      secretName: otel-agent-tls
      optional: true
  - name: kafka-user
    secret:
      secretName: otel-agent
      optional: true
  - name: kafka-ca
    secret:
      secretName: tradenova-cluster-ca-cert
      optional: true
  volumeMounts:
  - name: queue
    mountPath: /var/lib/otelcol
  - name: agent-tls
    mountPath: /etc/otel/tls
    readOnly: true
  - name: kafka-user
    mountPath: /etc/otel/kafka-user
    readOnly: true
  - name: kafka-ca
    mountPath: /etc/otel/kafka-ca
    readOnly: true
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            tls: &id001
              cert_file: /etc/otel/tls/tls.crt
              key_file: /etc/otel/tls/tls.key
              client_ca_file: /etc/otel/tls/ca.crt
            auth:
              authenticator: bearertokenauth
          http:
            endpoint: 0.0.0.0:4318
            tls: *id001
            auth:
              authenticator: bearertokenauth
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 25
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        pod_association:
        - sources:
          - from: resource_attribute
            name: k8s.pod.uid
        - sources:
          - from: resource_attribute
            name: k8s.pod.ip
        - sources:
          - from: connection
        extract:
          metadata:
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.deployment.name
          - k8s.cronjob.name
          - k8s.job.name
          - k8s.node.name
          labels:
          - tag_name: tradenova.team
            key: team
            from: pod
      resource/platform:
        attributes:
        - key: deployment.environment.name
          value: training
          action: upsert
        - key: k8s.cluster.name
          value: tradenova-lab
          action: upsert
      batch:
        send_batch_size: 2048
        timeout: 1s
    exporters:
      kafka:
        brokers:
        - tradenova-kafka-bootstrap.kafka.svc.cluster.local:9093
        traces:
          topic: otlp-traces
          encoding: otlp_proto
        metrics:
          topic: otlp-metrics
          encoding: otlp_proto
        logs:
          topic: otlp-logs
          encoding: otlp_proto
        partition_traces_by_id: true
        sending_queue:
          enabled: true
          storage: file_storage/queue
        tls:
          ca_file: /etc/otel/kafka-ca/ca.crt
          cert_file: /etc/otel/kafka-user/user.crt
          key_file: /etc/otel/kafka-user/user.key
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      file_storage/queue:
        directory: /var/lib/otelcol/agent
        create_directory: true
      bearertokenauth:
        header: x-tradenova-token
        scheme: ''
        token: ${env:INGEST_TOKEN}
    service:
      extensions:
      - health_check
      - file_storage/queue
      - bearertokenauth
      pipelines:
        traces:
          receivers:
          - otlp
          processors: &id002
          - memory_limiter
          - k8sattributes
          - resource/platform
          - batch
          exporters:
          - kafka
        metrics:
          receivers:
          - otlp
          processors: *id002
          exporters:
          - kafka
        logs:
          receivers:
          - otlp
          processors: *id002
          exporters:
          - kafka
      telemetry:
        metrics:
          readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888
