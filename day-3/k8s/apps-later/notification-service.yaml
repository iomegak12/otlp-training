# notification-service (Node.js): deployed LIVE in Lab 1, team "trading".
# No OpenTelemetry code or package in the image. One annotation, and the Operator injects
# Node.js auto-instrumentation. trade-api already calls this service, so its spans join
# the existing trade traces as soon as the pod is up.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: tradenova
  labels: { app: notification-service, team: trading }
spec:
  replicas: 2
  selector:
    matchLabels: { app: notification-service }
  template:
    metadata:
      labels: { app: notification-service, team: trading }
      annotations:
        instrumentation.opentelemetry.io/inject-nodejs: "true"
    spec:
      containers:
        - name: notification-service
          image: __REGISTRY__/tradenova-notification-service:__IMAGE_TAG__
          ports:
            - containerPort: 3000
          env:
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=tradenova,service.version=3.0.0
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: tradenova
spec:
  selector: { app: notification-service }
  ports:
    - port: 3000
      targetPort: 3000
