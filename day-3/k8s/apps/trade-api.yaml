# trade-api (Java, Spring Boot): team "trading".
# The image has no OpenTelemetry agent. The annotation below asks the OpenTelemetry Operator to
# inject the Java agent when the pod is created (see k8s/instrumentation/instrumentation.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trade-api
  namespace: tradenova
  labels: { app: trade-api, team: trading }
spec:
  replicas: 2
  selector:
    matchLabels: { app: trade-api }
  template:
    metadata:
      labels: { app: trade-api, team: trading }       # "team" becomes tradenova.team (k8sattributes)
      annotations:
        instrumentation.opentelemetry.io/inject-java: "true"
    spec:
      topologySpreadConstraints:                       # one replica per worker where possible
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: trade-api }
      containers:
        - name: trade-api
          image: __REGISTRY__/tradenova-trade-api:__IMAGE_TAG__
          ports:
            - containerPort: 8080
          env:
            - name: JDK_JAVA_OPTIONS
              value: -Xmx384m
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=tradenova,service.version=3.0.0
            # notification-service does not exist until Lab 1. Until then the call fails fast
            # (unknown host) and trade-api carries on: you will see that failed call in the traces.
            - name: NOTIFICATION_SERVICE_URL
              value: http://notification-service:3000
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 5
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: trade-api
  namespace: tradenova
spec:
  selector: { app: trade-api }
  ports:
    - port: 8080
      targetPort: 8080
