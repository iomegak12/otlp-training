# AFTER LAB 4: mTLS + token, Kafka TLS, attribute allowlist, tenant routing
# Gateway Collectors: a StatefulSet (each pod keeps its own disk for the persistent queue),
# managed by the OpenTelemetry Operator. They read the three Kafka topics as one consumer group
# and deliver to Tempo, Loki and Prometheus.

apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-gateway
  namespace: observability
spec:
  mode: statefulset
  image: otel/opentelemetry-collector-contrib:0.161.0
  serviceAccount: otel-gateway
  replicas: 2
  podAnnotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port: '8888'
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  env:
  - name: GOMEMLIMIT
    value: 800MiB
  initContainers:
  - name: queue-dir-permissions
    image: busybox:1.37
    command:
    - sh
    - -c
    - chown -R 10001:10001 /var/lib/otelcol/queue
    volumeMounts:
    - name: queue
      mountPath: /var/lib/otelcol/queue
  volumeClaimTemplates:
  - metadata:
      name: queue
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumes:
  - name: kafka-user
    secret:
      secretName: otel-gateway
      optional: true
  - name: kafka-ca
    secret:
      secretName: tradenova-cluster-ca-cert
      optional: true
  volumeMounts:
  - name: queue
    mountPath: /var/lib/otelcol/queue
  - name: kafka-user
    mountPath: /etc/otel/kafka-user
    readOnly: true
  - name: kafka-ca
    mountPath: /etc/otel/kafka-ca
    readOnly: true
  config:
    receivers:
      kafka:
        brokers:
        - tradenova-kafka-bootstrap.kafka.svc.cluster.local:9093
        group_id: otel-gateway
        initial_offset: earliest
        traces:
          topics:
          - otlp-traces
          encoding: otlp_proto
        metrics:
          topics:
          - otlp-metrics
          encoding: otlp_proto
        logs:
          topics:
          - otlp-logs
          encoding: otlp_proto
        message_marking:
          after: true
          on_error: false
        tls:
          ca_file: /etc/otel/kafka-ca/ca.crt
          cert_file: /etc/otel/kafka-user/user.crt
          key_file: /etc/otel/kafka-user/user.key
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 25
      batch:
        send_batch_size: 4096
        timeout: 2s
      transform/allowlist:
        error_mode: ignore
        trace_statements:
        - keep_matching_keys(span.attributes, "^(http\\.request\\.method|http\\.response\\.status_code|http\\.route|url\\.scheme|server\\.|network\\.|db\\.|messaging\\.|rpc\\.|error\\.|exception\\.|code\\.|thread\\.|tradenova\\.(order|risk|channel|trade)\\.)")
        log_statements:
        - keep_matching_keys(log.attributes, "^(http\\.request\\.method|http\\.response\\.status_code|http\\.route|url\\.scheme|server\\.|network\\.|db\\.|messaging\\.|rpc\\.|error\\.|exception\\.|code\\.|thread\\.|tradenova\\.(order|risk|channel|trade)\\.)")
    connectors:
      routing/traces:
        default_pipelines:
        - traces/shared
        table:
        - condition: resource.attributes["tradenova.team"] == "trading"
          pipelines:
          - traces/trading
        - condition: resource.attributes["tradenova.team"] == "wealth"
          pipelines:
          - traces/wealth
      routing/logs:
        default_pipelines:
        - logs/shared
        table:
        - condition: resource.attributes["tradenova.team"] == "trading"
          pipelines:
          - logs/trading
        - condition: resource.attributes["tradenova.team"] == "wealth"
          pipelines:
          - logs/wealth
    exporters:
      otlp_grpc/tempo:
        endpoint: tempo.monitoring.svc.cluster.local:4317
        tls:
          insecure: true
        headers:
          X-Scope-OrgID: tradenova-shared
        sending_queue:
          enabled: true
          storage: file_storage/queue
        retry_on_failure:
          enabled: true
          max_elapsed_time: 0
      otlp_http/loki:
        endpoint: http://loki.monitoring.svc.cluster.local:3100/otlp
        headers:
          X-Scope-OrgID: tradenova-shared
        sending_queue:
          enabled: true
          storage: file_storage/queue
        retry_on_failure:
          enabled: true
          max_elapsed_time: 0
      otlp_grpc/tempo-trading:
        endpoint: tempo.monitoring.svc.cluster.local:4317
        tls:
          insecure: true
        headers:
          X-Scope-OrgID: trading
        sending_queue:
          enabled: true
          storage: file_storage/queue
        retry_on_failure:
          enabled: true
          max_elapsed_time: 0
      otlp_grpc/tempo-wealth:
        endpoint: tempo.monitoring.svc.cluster.local:4317
        tls:
          insecure: true
        headers:
          X-Scope-OrgID: wealth
        sending_queue:
          enabled: true
          storage: file_storage/queue
        retry_on_failure:
          enabled: true
          max_elapsed_time: 0
      otlp_http/loki-trading:
        endpoint: http://loki.monitoring.svc.cluster.local:3100/otlp
        headers:
          X-Scope-OrgID: trading
        sending_queue:
          enabled: true
          storage: file_storage/queue
        retry_on_failure:
          enabled: true
          max_elapsed_time: 0
      otlp_http/loki-wealth:
        endpoint: http://loki.monitoring.svc.cluster.local:3100/otlp
        headers:
          X-Scope-OrgID: wealth
        sending_queue:
          enabled: true
          storage: file_storage/queue
        retry_on_failure:
          enabled: true
          max_elapsed_time: 0
      prometheus_remote_write:
        endpoint: http://prometheus-server.monitoring.svc.cluster.local/api/v1/write
        tls:
          insecure: true
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      file_storage/queue:
        directory: /var/lib/otelcol/queue
        create_directory: true
    service:
      extensions:
      - health_check
      - file_storage/queue
      pipelines:
        traces:
          receivers:
          - kafka
          processors: &id001
          - memory_limiter
          - transform/allowlist
          - batch
          exporters:
          - routing/traces
        traces/trading:
          receivers:
          - routing/traces
          exporters:
          - otlp_grpc/tempo-trading
        traces/wealth:
          receivers:
          - routing/traces
          exporters:
          - otlp_grpc/tempo-wealth
        traces/shared:
          receivers:
          - routing/traces
          exporters:
          - otlp_grpc/tempo
        logs:
          receivers:
          - kafka
          processors: *id001
          exporters:
          - routing/logs
        logs/trading:
          receivers:
          - routing/logs
          exporters:
          - otlp_http/loki-trading
        logs/wealth:
          receivers:
          - routing/logs
          exporters:
          - otlp_http/loki-wealth
        logs/shared:
          receivers:
          - routing/logs
          exporters:
          - otlp_http/loki
        metrics:
          receivers:
          - kafka
          processors:
          - memory_limiter
          - batch
          exporters:
          - prometheus_remote_write
      telemetry:
        metrics:
          readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888
  autoscaler:
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilization: 60
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0
      scaleDown:
        stabilizationWindowSeconds: 120
