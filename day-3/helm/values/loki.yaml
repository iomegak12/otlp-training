# Loki: single binary, filesystem storage, MULTI-TENANT (every request needs X-Scope-OrgID).
# Tenants used in the lab: tradenova-shared (before Lab 4), trading and wealth (after Lab 4).
fullnameOverride: loki
deploymentMode: SingleBinary
loki:
  auth_enabled: true
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    reject_old_samples: true
    reject_old_samples_max_age: 168h
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { memory: 2Gi }
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
chunksCache:
  enabled: false
resultsCache:
  enabled: false
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
